# issue #187：最小 CI —— node 22/24 矩阵 + 全量语法检查 + 本地门禁全套。
# 口径来自工单 docs/tasks/261016-min-ci.md（issue #187 那份提案写于「零依赖 + 1154 用例」的年代，已过期）：
#   - 仓库**故意没有 lockfile**（`package-lock.json` 被 .gitignore），所以是 `npm install --include=dev`，
#     不是 `npm ci`（后者会直接报 "can only install with an existing package lock"）。
#   - devDependencies 确实存在（`typescript` + `@types/node`，issue #213 授权，只为产 `.d.ts`）：
#     `check:types` / `check:types-build` / `check:pack-links` / `check:release` 缺 `tsc` 会 exit 1，
#     所以「零依赖不需要装」这一条不能再照抄。
#   - `npm run soak` 需要真实 relay 配置与 key ⇒ **不进 CI**。
#   - 不加缓存、不加 Windows/macOS（首版求简单；后者的前置 #185/#186 未做）。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 手工重跑入口（也是本单验收 C2 的验证通道）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      # 没有 lockfile ⇒ npm install（不是 npm ci）。依赖只有 2 个 dev 包，故不配缓存。
      - name: Install dev dependencies (no lockfile in this repo by design)
        run: npm install --include=dev

      # issue #187：全量语法检查（旧的 `npm run check` 只看 src/index.js 一个文件，bin/ 语法错不会红）
      - name: Syntax check (all tracked .js/.mjs/.cjs)
        run: npm run check:syntax

      - name: Test suite
        run: npm test

      - name: Documentation drift check
        run: npm run check:docs

      # 阻塞（issue #187 原本写 continue-on-error 先观察，今天它已经是绿的 ⇒ 直接当阻塞门禁）
      - name: Documentation drift check (strict)
        run: npm run check:docs:strict

      # 阻塞（issue #642）：**AGENTS 指令面**的硬门——`AGENTS.md` / `AGENTS_cn.md` 是每次会话自动注入、
      # 模型不查证就照着执行的那一页，所以上面三类「住在别处、会过期」的可变量不许写进去：工单状态句
      # （工单号 + 状态词）、会过期的实测抄件（实测动词 + 数字）、裸源码坐标（带行号的 src 路径）。
      # 例外是显式登记表 + 理由（空转条目即红），常量那一类当场与 scripts/*.mjs 的现值对账；
      # 存量命中按「文件 × 类别」钉上限（棘轮：清账不红、超上限红）。
      # 位置紧跟 `Documentation drift check` 一族：它和 check:docs:strict 一样是「文档面」的门。
      - name: AGENTS instruction-face gate (status claims / expiring numbers / bare source lines)
        run: npm run check:agents-directives

      # 阻塞：上一条自己的反向证（临时树副本，不碰真文档）——往 AGENTS.md 塞一句状态断言 / 一个实测数 /
      # 一条裸坐标都必须红并点名文件:行，塞一条登记过的例外必须绿，登记表里留一条用不上的必须红（#210 R2），
      # 同一句塞进 CHANGELOG 或 docs/ 必须绿（历史一侧只计数不判定），变异没落上也算失败。
      # 为什么不并进上一条：那条证的是「今天的指令面干净」，这条证的是「判据还拦得住」。
      - name: AGENTS instruction-face gate self-test
        run: node scripts/agents-directive-scan.mjs --self-test

      # 阻塞（issue #560）：退役扁平拼写的硬门（#523 的扫描器）。
      # 现状类（architecture* / charts* / requirements* / testing* / maintenance-policy* / soak.md）
      # 出现退役扁平写点 ⇒ 红；历史类与契约类的命中数必须等于钉子（SUSPECT / UNPINNED 同样红）；
      # 未登记的 `docs/**.md` 按现状类照扫（「这张单没管到」不是豁免理由）。
      - name: Retired flat-spelling gate
        run: npm run check:docs-spelling

      # 阻塞：上面那道门的反向证（内存夹具，不写盘）——同一套判据里改一处必须红、不改必须绿，
      # 分类清单必须按路径覆盖 EN/CN，未登记路径必须归现状类，钉子空转/抬升/掉落都必须红（#210 R2）。
      # 为什么不并进上面那条：那条证的是「今天的文档干净」，这条证的是「判据还拦得住」。
      - name: Retired flat-spelling gate self-test
        run: node scripts/retired-spelling-scan.mjs --self-test

      - name: Doc example fences
        run: npm run check:docs-examples

      - name: Packaged markdown link closure
        run: npm run check:pack-links

      # 阻塞（issue #505）：`test/contract/` 发布面判据自己的反向证——同一套判据跑在**内存夹具**上
      # （不跑 npm pack、不联网、不写盘）：从 files 删一条真实存在的 test/contract/*.js 必须红并点名、
      # 加一条不存在的 test/contract/ghost.js 必须红并点名、什么都不改必须绿，登记表空转（文件没了 /
      # 其实随包了 / why 为空 / path 不是具体文件 / 条数偏离上限）也必须红，变异没落上同样算失败（#210 R2）。
      # 为什么不并进上面那条：那条证的是「今天的树对得上」，这条证的是「判据还拦得住」——把判据改坏时
      # 前者照样 exit 0（判据 1 一旦只查 files→包方向，漏包方向就再也红不了）。
      - name: Pack-link contract publish-surface self-test
        run: node scripts/pack-link-check.mjs --self-test

      # 阻塞（issue #534）：清点表 `test/compat-pin-inventory.md` 自称「逐行零误差」，但在此之前
      # **没有任何东西跑它的 `--verify`**——表漂移完全静默（活证：A12 以 3 处不一致交上来，
      # 只因主 agent 手跑 `--verify` 才被抓到）。成本实测 1.82 s / 150 MB，比 check:release 便宜一个量级。
      # 放在 Test suite 之后：表是对 test/**.js 的清点，测试还没跑就验表没意义。
      # ⚠ 表漂了**不许手改数字**：改测试文件里的兼容钉子必须同片机器刷表
      #   `node scripts/flat-count-inventory.mjs . --sync test/compat-pin-inventory.md`。
      - name: Compatibility-pin inventory verify
        run: npm run check:inventory

      # 阻塞（issue #586）：配置叶子「值类型 / 值域」现状表 docs/config-leaf-value-status{,_cn}.md 由探针
      # 生成（43 叶 × 8 错值 = 344 格，每格过一次真的两轮 runToolLoop），这里重跑探针并把重算出来的两张表
      # 与入库的逐字比对：漂了或手改过 ⇒ exit 1 并点名文件。实测约 0.8 秒，所以它阻塞。
      # ⚠ 表漂了**不许手改数字**：`node scripts/config-leaf-value-probe.mjs --sync docs/config-leaf-value-status.md docs/config-leaf-value-status_cn.md`。
      # 探针自己还有两道自检（`configSchemaSelfCheck` 红 / 三次基线跑的指纹不一致 ⇒ exit 2），所以「探针坏了」
      # 不会静默成一张漂亮的红表。
      - name: Config-leaf value status verify
        run: npm run check:config-leaf-values
      # 阻塞（issue #257 T7）：常驻变异样本表 `test/mutation-samples.md` 的**验表**。
      # 表里第 4/5/6 列（行号 / 锚点 sha256 / 命中数）与合计行由真树重算，手改数字 = 伪造 ⇒ 本步红。
      # 放在 Compatibility-pin inventory verify 之后：两条是同一族（**提交进库的表必须与真树对得上**），
      # 挨着放，红了能一眼看出是哪张表漂了。本步只读 `src/` / `bin/` 与表，不依赖测试跑没跑过。
      # ⚠ 表漂了**不许手改数字**：`node scripts/mutation-sample-check.mjs --sync test/mutation-samples.md`。
      - name: Mutation sample table verify
        run: npm run check:mutation

      # 阻塞：上一条自己的反向证——同一套判据跑在**内存夹具**上（不落盘、不碰真树）：
      # 手改行号 / sha / 合计行必须红，锚点死了 / 锚点重复 / 捕获者没了 / 空变异 / 签名被削弱必须红，
      # 删一条样本（含「删了再 --sync 把合计刷对」）必须红在样本数下限，`--sync` 只许改派生列，
      # 变异没落上也必须判红（#210 R2）。为什么不并进上一条：那条证的是「今天的表与树对得上」，
      # 这条证的是「判据还拦得住」——把判据改坏时前者照样 exit 0。
      - name: Mutation sample check self-test
        run: node scripts/mutation-sample-check.mjs --self-test

      # 阻塞（issue #429）：零消费者导出 × `@deprecated` 登记的对账门。
      # 候选清单由 `check:exports` 的 `computeInventory()` **现算**（import 进来，不抄第二份）；
      # 登记取自源码里**紧贴声明**的那个 JSDoc 块（贴错位置 tsc 会静默丢掉，所以位置本身是判据）。
      # 红：候选没登记（R1）/ 有消费者的名字被标删除（R2）/ 版本不是 0.30（R3）/ 没写迁移目标（R4）/
      # 标记块没贴声明（R5）/ 认不出贴给谁（R6），逐条点名 `符号 @ 文件:行`。
      # 它**只证仓内**零消费者：宿主仓不在扫描面里 ⇒ 删前另核宿主，本步不代表「可以删了」。
      - name: Deprecated-export registry reconciliation
        run: npm run check:exports:deprecated

      # 阻塞：上一条自己的反向证（真树内存副本，不写盘）——基线绿、删一条登记 ⇒ 红并点名、
      # 还原 ⇒ 绿、**给有消费者的符号也标上 ⇒ 红并点名**、版本写错 / 迁移目标指到空气里 /
      # 块与声明之间夹空行 / internal-only 被标删除 都要红，变异没落上一律算失败（#210 R2）。
      - name: Deprecated-export registry self-test
        run: node scripts/deprecated-export-check.mjs --self-test

      - name: Test hygiene guard
        run: npm run check:tests

      # 阻塞（issue #374）：守卫自己的反向证——同一张规则表跑在**内存假文件集合**上（不落盘、不碰 test/）。
      # `mkdtempSync` / `mkdtemp` / `fs.mkdtemp` 必须红，`makeTmp` 必须绿，`test-hygiene-exempt: <理由>` 绿而
      # 缺理由红且点名行号，`test/helpers/tmp.js` 自身不计数，变异没落上也算失败（#210 R2）。
      # 为什么不并进上面那条：那条证的是「今天的 test/ 干净」，这条证的是「规则表还拦得住」——改坏规则表时
      # 前者照样 exit 0（实测：把 bare-mkdtemp 的 Sync 变体删掉 ⇒ check:tests 仍绿，本步 3 例红）。
      - name: Test hygiene guard self-test
        run: node scripts/test-hygiene-check.mjs --self-test

      # --checkJs 棘轮（issue #214）：当前基线 116 / --with-tools 152，只减不增。
      # ⚠ 基线的**唯一真值**是 `scripts/type-check-ratchet.mjs` 里的 `BASELINE_ROOT` / `BASELINE_WITH_TOOLS`；
      #   这行只是人读提示（不在 `check:docs` 覆盖面内，漂了没人拦），**漂了以脚本为准**。
      # 干净 checkout 里没有生成的 src/**/*.d.ts；若残留会让棘轮脚本自己硬失败（假绿防线）。
      - name: Type-error ratchet
        run: npm run check:types

      # issue #416：strict 口径的**观测点**（不参与判定）。
      # ⚠ 别把「不判定」读成「命令自身 exit 恒 0」——那正是本步骤注释原稿写错的一句（2026-10-23 实测纠错）：
      # `--strict-report` 仍有三条硬失败路径（tsc 起不来 / tsc 非 0 退出却一条错都没解析出来 / 共用的
      # 陈旧声明守卫撞上残留的 `src/**/*.d.ts`）。实测：`npm run types:build` 之后直接跑
      # `node scripts/type-check-ratchet.mjs --strict-report` ⇒ **exit 1**（守卫拒绝在「声明遮住实现」时报 0）。
      # 所以「观测」这件事由下面的 `continue-on-error: true` 兑现，而不是靠命令永远 exit 0：
      # 环境不干净会让它红（红得对——那种情形下 strict 报 0 是假绿），但它不阻塞流水线。
      # 棘轮量的 116/152 是**非 strict** 口径；strict 那个数只是日志，现值以命令输出为准（本行不钉它，见
      # scripts/type-check-ratchet.mjs 的 strict 观测点注释）。
      - name: Type-error strict observation (observation only, gates nothing)
        continue-on-error: true
        run: npm run check:types:strict

      - name: Declaration build assertion
        run: npm run check:types-build

      # 闸门（ERIX_E2E_REAL=1）在 CI 里是关着的 ⇒ 这条 exit 0 并打印分类原因：
      # 它验的是「装好的 CLI 打真上游」这套自检装置本身没坏，不代表真上游可用。
      - name: Gated real-upstream CLI smoke (gate closed in CI)
        run: npm run check:cli-real

      # 离线、自清洁、约 15 s，但矩阵里跑两遍纯浪费 ⇒ 只在 node 22 跑一次
      - name: Release check (offline pack → install → contract suites → tsc --strict → CLI smoke)
        if: matrix.node == 22
        run: npm run check:release

      # 阻塞（issue #302）：--self-test 的期望集合与「本机有没有 docs/tasks/」彻底解耦——那两条 `#280`
      # 树形用例现在跑在**合成树夹具**上（无档案目录 / 空档案目录 / 有档案目录，三种形状各跑一遍），
      # 落地检查比对的是夹具声明的档案清单，而不是这台机器上的真实实物数。于是同一提交在干净检出
      # （CI）与开发机上给同一个结论：三种树形实测各 **103 例全绿、0 红**（造树方式见报告：
      # `git archive HEAD | tar -x` 之后分别不建 / 建空 / 建带文件的 `docs/tasks/` 各跑一遍）。
      # #281 时期那条 `continue-on-error: true` 的理由（干净克隆里预期红 3 条）已经不成立，故摘掉转阻塞。
      # ⚠ 红一条就是回归，按回归查——别再把它当「观测项」。
      - name: docs-drift-check self-test
        run: node scripts/docs-drift-check.mjs --self-test

      # 阻塞（issue #257 T7）：样本表里每一条**真的会被闸咬住**的机器证据——逐条把变异写进真文件、
      # 跑该条的捕获者、要求它**红且红在该报的那条断言上**（只认 `not ok N - …`，通过时的 `ok N -`
      # 不算），再还原、再跑一遍要求**绿**（否则这条红不能归因给变异）。
      # 为什么放在**最后**：① 它跑的是单个测试文件，前面 `Test suite` 已经绿了，「变异后的红」才可归因；
      # ② 它是整条流水线里**唯一会临时改写 tracked 源文件**的步骤（`src/` / `bin/`），放在末尾，
      #    后面没有任何步骤会读到一个刚被变异-还原过的树；还原由脚本自己逐条校验（内容与变异前不一致
      #    就停手并红），并挂了 SIGINT/SIGTERM 还原钩子。实测 8 条 × (变异后 + 还原后) 共 16 次
      #    `node --test <单文件>`，约 4.5 s。
      - name: Mutation samples actually bite (mutate → red → restore → green)
        run: npm run check:mutation:run
