name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 手工重跑入口
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── 三个 job，按「判据性质」分层（issue #802）────────────────────────────────────
#
# 病根（261109 实测）：最近 200 次运行 138 成功 / 49 失败 / 13 取消（红率 25%）；抽 12 次失败，
# **9 次落在「committed 表 vs 树」这类登记闸上**（兼容性钉子表 5、套件汇总 2、drift 自测 2、
# 变异表 1、配置叶表 1、随包链接 1），真测试套件只红 1 次。于是 PR 的红基本不表示「坏了」，
# 而表示「你动了一棵树，某张派生表该刷了」——那不是判定，那是税。
#
#   · `real`      —— 真的坏了才会红：语法、全量套件、套件汇总、CHANGELOG 覆盖、`tsc` 棘轮、
#                    声明生成、离线打包、变异样本真跑。**每次事件都阻塞**，矩阵 22 + 24。
#   · `registries` —— 「提交进库的表必须与真树对得上」那一族。PR 上**看得见但不停车**
#                    （job 级 `continue-on-error`），`main` / 手工重跑上阻塞。
#   · `docs`      —— 文档面 + 指令面那一族。同样：PR 上看得见不停车，`main` 上阻塞。
#
# 严格度一点没降：**发版前置** `npm run release:day -- --stage preflight` 把这三族全部当阻塞项跑
# （它的步骤表在 `scripts/release-day.mjs` 的 `PREFLIGHT_STEPS`，文档见
# `docs/maintenance/command-reference.md#release-day`）。分层只改变「PR 停不停车」，不改变「发版前必须全绿」。

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # 1. real —— 行为面。真的坏了才会红。
  # ══════════════════════════════════════════════════════════════════════════════
  test:
    name: real · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # issue #774：22 是 `engines` 下限与宿主实跑版本，24 是 agent 与新宿主实际会跑到的版本。
        # 「只在 22 上成立的判断不是判断」：reporter 类红就是只在一个 runner 上出现的那一类。
        node: [22, 24]
    steps:
      # issue #691：`fetch-depth: 0` 是 CHANGELOG 覆盖闸的硬前置（它要读 first-parent 合并历史与 tag）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      # 没有 lockfile（本仓刻意 gitignore `package-lock.json`）⇒ `npm install`，**永远不用 `npm ci`**。
      - name: Install dev dependencies (no lockfile in this repo by design)
        run: npm install --include=dev

      - name: Syntax check (all tracked .js/.mjs/.cjs)
        run: npm run check:syntax

      # issue #301 / #774：reporter 钉在 `package.json` 的 test 脚本里（`--test-reporter=tap`），
      # 这样本地 / agent / CI 交回同一份 TAP 形状；`set -o pipefail` 不能删（否则 `| tee` 会吃掉退出码）。
      - name: Test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test-suite.log"

      # 套件汇总与登记值对账：`tests` 逐字相等、`fail` 为 0、`skipped` 不超登记上限；
      # 读不到完整汇总按 exit 2 红（「未判定」不等于绿）。数字漂了的合法处置只有改登记表 + 补 observations。
      - name: Test suite summary reconcile (CI numbers vs registered expectations)
        run: npm run check:test-summary -- --log "$RUNNER_TEMP/test-suite.log"

      # 上一条自己的反向证（合成 TAP 夹具 + 合成登记表）：判据还拦得住吗。
      - name: Test suite summary reconcile self-test
        run: npm run check:test-summary -- --self-test

      # issue #691：碰到公开面的 first-parent 合并必须在本版 CHANGELOG 段里被点名。
      - name: CHANGELOG coverage of public-surface merges
        run: npm run check:changelog

      # issue #374：test/ 卫生（`makeTmp` 而不是裸 `mkdtemp`），外加它自己的反向证。
      - name: Test hygiene guard
        run: npm run check:tests

      - name: Test hygiene guard self-test
        run: node scripts/test-hygiene-check.mjs --self-test

      # --checkJs 棘轮（issue #214）：只减不增。基线真值在 `scripts/type-check-ratchet.mjs`，本文件不抄。
      # 干净 checkout 里没有生成的 `src/**/*.d.ts`；残留会让棘轮自己硬失败（假绿防线）。
      - name: Type-error ratchet
        run: npm run check:types

      # issue #653：工具档是**另一档基线**，不跑它那个常量漂了也看不见。
      - name: Type-error ratchet (tools entry tier)
        run: npm run check:types -- --with-tools

      # issue #417：strict 口径的棘轮（阻塞）。它卡的是「新增的 strict 错」，不是存量。
      - name: Type-error strict ratchet
        run: npm run check:types:strict

      - name: Type-error strict ratchet (tools entry tier)
        run: npm run check:types:strict -- --with-tools

      - name: Declaration build assertion
        run: npm run check:types-build

      # 闸门（ERIX_E2E_REAL=1）在 CI 里是关着的 ⇒ 这条 exit 0 并打印分类原因（验的是装置本身没坏）。
      - name: Gated real-upstream CLI smoke (gate closed in CI)
        run: npm run check:cli-real

      # 离线、自清洁、约 15 s，矩阵里跑两遍纯浪费 ⇒ 只在 node 22 跑一次。
      - name: Release check (offline pack → install → contract suites → tsc --strict → CLI smoke)
        if: matrix.node == 22
        run: npm run check:release

      # issue #257 T7：样本表里每一条**真的会被闸咬住**的机器证据。放最后：它跑单个测试文件
      # （前面 `Test suite` 已绿，变异后的红才可归因），且是唯一会临时改写 tracked 源文件的步骤。
      - name: Mutation samples actually bite (mutate → red → restore → green)
        run: npm run check:mutation:run

  # ══════════════════════════════════════════════════════════════════════════════
  # 2. registries —— 「提交进库的表必须与真树对得上」。
  #    PR 上不停车（看得见、不阻塞合并）；main / 手工重跑上阻塞。发版前置里仍然是阻塞项。
  # ══════════════════════════════════════════════════════════════════════════════
  registries:
    name: registries · node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      # `fetch-depth: 0` 同样不能省：`check:inventory` / `check:mutation` 读的是树，但
      # `check:changelog` 一族读 tag 与合并史（见 `real` 那个 job 的注释）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies (no lockfile in this repo by design)
        run: npm install --include=dev

      # issue #534：清点表 `test/compat-pin-inventory.md` 的 `--verify`。
      # ⚠ 表漂了不许手改数字：`node scripts/flat-count-inventory.mjs . --sync test/compat-pin-inventory.md`
      # （issue #802 起单归属分派行的写点也是派生值，`--sync` 能自己刷；跨片行仍是人工格，会点名 MANUAL_CELL）。
      - name: Compatibility-pin inventory verify
        run: npm run check:inventory

      # issue #586：配置叶「值类型 / 值域」现状表由探针重算再逐字比对。
      # ⚠ 刷表：`node scripts/config-leaf-value-probe.mjs --sync docs/config-leaf-value-status.md docs/config-leaf-value-status_cn.md`
      - name: Config-leaf value status verify
        run: npm run check:config-leaf-values

      # issue #257 T7：变异样本表的验表（第 4/5/6 列与合计行由真树重算）。
      # ⚠ 刷表：`node scripts/mutation-sample-check.mjs --sync test/mutation-samples.md`
      - name: Mutation sample table verify
        run: npm run check:mutation

      # 上一条自己的反向证（内存夹具，不落盘、不碰真树）。
      - name: Mutation sample check self-test
        run: node scripts/mutation-sample-check.mjs --self-test

      - name: Packaged markdown link closure
        run: npm run check:pack-links

      # issue #505：`test/contract/` 发布面判据自己的反向证（内存夹具）。
      - name: Pack-link contract publish-surface self-test
        run: node scripts/pack-link-check.mjs --self-test

      # issue #429：零消费者候选表 × `@deprecated` 登记表，外加它自己的反向证。
      - name: Deprecated-export registry reconciliation
        run: npm run check:exports:deprecated

      - name: Deprecated-export registry self-test
        run: node scripts/deprecated-export-check.mjs --self-test

      # issue #687：移除闸的反向证（装好的包 × 运行时导出面）。
      - name: Guide removal gate self-test
        run: node scripts/guide-removal-gate.mjs --self-test

      # issue #689：发版日那条命令自己的反向证（全离线：合成树 + 假 runner）。
      - name: Release-day command self-test
        run: node scripts/release-day.mjs --self-test

  # ══════════════════════════════════════════════════════════════════════════════
  # 3. docs —— 文档面 + 指令面。同样是 PR 不停车、main 阻塞。
  # ══════════════════════════════════════════════════════════════════════════════
  docs:
    name: docs · node 22
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      # ⚠ 默认浅克隆（depth 1、不带 tag）会让 `check:docs` 直接 exit 2「未判定 TAG_MISSING」——
      # 它的 changelog-date 判据要拿 registry 的 `dist-tags.latest` 对仓库里的 tag（本 PR 第一次跑 CI
      # 就撞上了：registry 说 0.31.0 已发布，而浅克隆里没有 `v0.31.0`）。未判定既不是绿也不是红，
      # 所以这一格必须取全 tag。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies (no lockfile in this repo by design)
        run: npm install --include=dev

      - name: Documentation drift check
        run: npm run check:docs

      # issue #187：这条今天已经是绿的，所以它阻塞（`continue-on-error` 在 job 级，PR 上不停车）。
      - name: Documentation drift check (strict)
        run: npm run check:docs:strict

      # issue #642：AGENTS 指令面的硬门（状态句 / 会过期的抄件 / 裸坐标 / 字节预算）。
      - name: AGENTS instruction-face gate (status claims / expiring numbers / bare source lines)
        run: npm run check:agents-directives

      # 上一条自己的反向证（合成树夹具，不碰真文档）。
      - name: AGENTS instruction-face gate self-test
        run: node scripts/agents-directive-scan.mjs --self-test

      # issue #560：退役扁平拼写的硬门，外加它自己的反向证。
      - name: Retired flat-spelling gate
        run: npm run check:docs-spelling

      - name: Retired flat-spelling gate self-test
        run: node scripts/retired-spelling-scan.mjs --self-test

      - name: Doc example fences
        run: npm run check:docs-examples

      # issue #302：锚点自己的反向证。实测 ~7 分钟（本机独占，261109），是整条流水线最贵的一格，
      # 而它只跟 `scripts/docs-drift-check.mjs` 及其夹具有关 ⇒ **PR 上不跑**（issue #802），
      # `main` 与手工重跑上跑；发版前置里也跑（那里是阻塞项）。
      - name: docs-drift-check self-test
        if: github.event_name != 'pull_request'
        run: node scripts/docs-drift-check.mjs --self-test
