name: ci

on:
  # 261125 用户裁决：自动触发全部关停——`pull_request` 与 `push` 到 main 都不再跑 CI。
  # 停它的判据（261125 实测过去半个月 160 次 run）：9 次红里 6 次是派生登记表/派生列漂移，
  # 0 次是 src 行为回归；噪声淹没信号，且每次刷表都要一次 agent 往返。
  #
  # 门禁改由 ruleset「main-require-pr」承担：**必须走 PR 才能合 main，但不再要求任何 status check**。
  # 唯一自动门禁因此是本地 `npm run release:day -- --stage preflight`（发版前必跑）。
  #
  # 本文件保留的理由（#908 R2 换过一次）：原先是「`changelog-coverage-check.mjs` 要读它验步骤接线」——
  # 那条接线判据已随文档族一起撤（`check:changelog` 不再是 CI 步骤）。现在的理由是：这一份是**干净环境
  # 那一族判据唯一会跑的地方**（真打包、真装包、真 CLI、跨 node 大版本），而这三类在本机跑不出同样的
  # 可信度（本机有开发树残留、有全局 npm 缓存、只有一个 node）。
  #
  # 恢复自动触发：取消下面三行注释，并把 required_status_checks（`real · node 22` /
  # `real · node 24`）加回 ruleset，两者必须同批改，否则 main 会推不进去。
  # pull_request:
  # push:
  #   branches: [main]
  #
  # 手工重跑入口（保留）：`gh workflow run ci.yml`。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── 一个 job：CI 只留「干净环境才证得动、或需要跨 node 大版本」的判据（issue #908 R2，261126）─────
#
# 两段裁决，都写在 issue 上：
#   · **文档族整族撤出 CI**（#802 已经把它移出「每次事件」；#908 R2 把最后剩的 `check:changelog`
#     和三条文档向 self-test 也拆了）。文档闸的家是版本边界（`release:day` 的 preflight / writeback）
#     与周期性 agent pass（`docs/maintenance/doc-review-pass.md`，入口 `npm run docs:pass`）。
#   · **代码族按「谁真的会跑」重审**。判据不是按「重不重要」排的，是按**它在不在场**排的：
#     `workflow_dispatch`-only 的 CI 是一台没人按就永远绿的仪表盘，所以「只在 CI 跑」在这棵树上
#     等于「哪儿都不跑」。凡是几秒级、又不需要干净环境的，一律搬进 `npm test`
#     （`test/gate-self-tests.test.js` 逐条 spawn）——每次都跑，比多一个 CI 步骤强得多。
#
# 留在 CI 的只有三类：
#   ① node 22 / 24 矩阵上的全量套件（#774：只在 22 上成立的判断不是判断）；
#   ② `tsc --checkJs` 四档棘轮（债务只减不增；**四步分开**跑，失败时一步就点名是哪个档位，
#      合起来跑反而要再去分辨——`test/type-check-strict-ratchet.test.js` 钉的就是这四条步骤在场
#      且都不带 `continue-on-error`，两档的先后顺序也钉着）；
#   ③ 干净环境才可信的三件：`check:release`（离线 pack → 装包 → 契约套件 → CLI 冒烟）、
#      `check:pack-links`（随包面来自真 tarball）、`check:mutation:run`（会临时改写 tracked 源文件）。
#
# 撤走的步骤与去处（每条都验过「谁 spawn 谁」，不是猜的）：
#   · `check:syntax`(3s)、`check:tests` 与它的 `--self-test`、`mutation-sample-check --self-test`、
#     `pack-link-check --self-test`、`check:config-leaf-values`(1s)
#     ⇒ **搬进 `npm test`**：`test/gate-self-tests.test.js`（实测这几条加起来 ≈ 4s）。
#   · `guide-removal-gate --self-test`、`release-day --self-test`
#     ⇒ **套件里本来就在跑**（`test/guide-removal-gate.test.js` / `test/release-day.test.js` 各自 spawn），
#     CI 那两步是纯重复。
#   · `check:inventory` ⇒ **整个闸已删**（issue #961 清单 B）。它是税闸：用 TypeScript AST 查「**测试代码**里
#     有没有写退役扁平键」，代价是每加一个这样的测试就要往 191 条白名单里登记一条。
#   · `check:docs-spelling` ⇒ **整个闸已删**（issue #961 清单 D）。1,640 行的扫描器 + 88 条手抄命中数钉子，
#     而近 20 条相关 commit 里**没有一条**是它的判据抓到活文档里的退役拼写，全是钉子重钉。
#     删掉后留下的边界缺口：一份**不可执行**的文档片段可以提到退役键名而没人红。
#     兜底是运行期（引擎当场拒并点名规位家）与 `check:docs-examples`（真的执行契约与两份 README 的 js 围栏）。
#   · `check:changelog` ⇒ 文档族，家在 `PREFLIGHT_STEPS[0]`（发版前置必跑）。
#   · `check:cli:model-e2e` ⇒ CI 里闸门 `ERIX_E2E_MODEL` 是关着的，这一步只 exit 0（空转）；
#     真跑在 `release:day --stage preflight` 的第 3 步。
#   · `registries` 那个 job 整体消失：它 7 步里 3 步纯重复、3 步进了套件、1 步是文档。
#     job 级 `continue-on-error` 也随之作废——PR 上「看得见但不停车」这个分层，在没有自动触发之后
#     已经没有可分的东西。

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # real · node 矩阵 —— 行为面 + 债务棘轮 + 干净环境的发布面
  # ══════════════════════════════════════════════════════════════════════════════
  test:
    name: real · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # issue #774：22 是 `engines` 下限与宿主实跑版本，24 是 agent 与新宿主实际会跑到的版本。
        # 「只在 22 上成立的判断不是判断」：reporter 类红就是只在一个 runner 上出现的那一类。
        node: [22, 24]
    steps:
      # `fetch-depth: 0` 留着，但**理由变了**：原先它是 `check:changelog` 的硬前置（读 tag 与
      # first-parent 合并史，#691），而那条闸已随文档族撤出 CI，所以现在没有任何步骤需要全历史。
      # 仍然取全历史，是因为 clean-env 那几步跑的是真打包/真装包：将来谁再往 CI 加一条读 tag 或
      # 合并史的判据，浅克隆会让它**静默空跑**（抽不到 tag ⇒ 无事可判 ⇒ 绿），而不是红。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      # 没有 lockfile（本仓刻意 gitignore `package-lock.json`）⇒ `npm install`，**永远不用 `npm ci`**。
      - name: Install dev dependencies (no lockfile in this repo by design)
        run: npm install --include=dev

      # issue #301 / #774：reporter 钉在 `package.json` 的 test 脚本里（`--test-reporter=tap`），
      # 这样本地 / agent / CI 交回同一份 TAP 形状。#905 起汇总数字不再对账，这一步只留
      # `npm test` 本身——它的退出码就是留下来的真判据（`| tee` 与 `set -o pipefail` 随对账一起撤）。
      # #908 R2 起这一步还包含几条闸自己的反向证（`test/gate-self-tests.test.js`）。
      - name: Test suite
        run: npm test

      # --checkJs 棘轮（issue #214）：只减不增。基线真值在 `scripts/type-check-ratchet.mjs`，本文件不抄。
      # 干净 checkout 里没有生成的 `src/**/*.d.ts`；残留会让棘轮自己硬失败（假绿防线）。
      - name: Type-error ratchet
        run: npm run check:types

      # issue #653：工具档是**另一档基线**，不跑它那个常量漂了也看不见。
      - name: Type-error ratchet (tools entry tier)
        run: npm run check:types -- --with-tools

      # issue #417：strict 口径的棘轮（阻塞）。它卡的是「新增的 strict 错」，不是存量。
      - name: Type-error strict ratchet
        run: npm run check:types:strict

      - name: Type-error strict ratchet (tools entry tier)
        run: npm run check:types:strict -- --with-tools

      # 声明生成断言（issue #213）：`prepack` 必须真把 `src/**/*.d.ts` 造出来。放最后而不是并进棘轮：
      # 它会往树里落声明文件，而声明文件在场时 `tsc --checkJs` 量的就不再是实现（棘轮自己会硬失败），
      # 所以它只能在四档棘轮都读完之后跑。
      - name: Declaration build assertion
        run: npm run check:types-build

      # 离线、自清洁，矩阵里跑两遍纯浪费 ⇒ 只在 node 22 跑一次。这是 CI 最无可替代的一步：
      # 真 tarball、真装包、真入口，「开发树里绿 / 干净检出里红」那一类（issue #914）只有这里抓得住。
      - name: Release check (offline pack → install → contract suites → tsc --strict → CLI smoke)
        if: matrix.node == 22
        run: npm run check:release

      # 随包 Markdown 链接闭合 + 发布面清单（`files`/`exports` 与 tarball 对账）。同样要真 pack。
      - name: Packaged markdown link closure
        if: matrix.node == 22
        run: npm run check:pack-links

      # issue #257 T7 / #906：样本清单里每一条**真的会被闸咬住**的机器证据。放最后：它跑单个测试文件
      # （前面 `Test suite` 已绿，变异后的红才可归因），且是唯一会临时改写 tracked 源文件的步骤。
      - name: Mutation samples actually bite (mutate → red → restore → green)
        if: matrix.node == 22
        run: npm run check:mutation:run
